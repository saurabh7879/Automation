<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --canvas:#010102;--surface-1:#0f1117;--surface-2:#16182b;--surface-3:#1a1d35;
  --hairline:#23252a;--hairline-strong:#2f313a;--hairline-tertiary:#3a3f4d;
  --ink:#f7f8f8;--ink-muted:#d0d6e0;--ink-subtle:#8a8f98;--ink-tertiary:#62666d;
  --primary:#5e6ad2;--primary-hover:#828fff;--primary-focus:#5e69d1;
  --semantic-success:#27a644;--semantic-error:#f87171;
  --r:12px;--rs:8px;--nav:56px;
  --c-wish:#5e6ad2;--c-app:#5e6ad2;--c-int:#5e6ad2;--c-off:#27a644;--c-rej:#62666d;
}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;color:var(--ink)}

.bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--canvas)}
.grid-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;display:none}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nav);
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;
  background:var(--canvas);backdrop-filter:blur(20px);border-bottom:1px solid var(--hairline)}
.nav-brand{display:flex;align-items:center;gap:10px;
  font-family:'Inter',sans-serif;font-weight:600;font-size:16px;color:var(--ink)}
.nav-logo{width:32px;height:32px;border-radius:6px;
  background:var(--surface-2);
  display:grid;place-items:center;font-size:17px;border:1px solid var(--hairline)}
.nav-actions{display:flex;gap:8px;align-items:center}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;
  border-radius:var(--rs);font-size:13px;font-weight:600;
  transition:all .2s;cursor:pointer;border:1px solid transparent}
.btn-primary{background:var(--primary);color:#fff;
  box-shadow:none}
.btn-primary:hover{background:var(--primary-hover);transform:translateY(0)}
.btn-ghost{background:var(--surface-2);border-color:var(--hairline);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-3);border-color:var(--primary);color:var(--primary)}
.btn-danger{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.25);color:var(--semantic-error)}
.btn-danger:hover{background:rgba(248,113,113,.2)}
.btn-sm{padding:8px 14px;font-size:12px}
.btn-gen{width:100%;padding:12px;border-radius:var(--r);
  background:var(--surface-2);
  border:1px solid var(--hairline);color:var(--ink);
  font-size:14px;font-weight:600;gap:8px;transition:all .2s}
.btn-gen:hover{background:var(--surface-3);border-color:var(--primary)}

/* BOARD */
.board{position:relative;z-index:1;display:flex;gap:16px;
  padding:calc(var(--nav) + 20px) 24px 48px;
  overflow-x:auto;min-height:100vh;align-items:flex-start}
.board::-webkit-scrollbar{height:5px}
.board::-webkit-scrollbar-thumb{background:var(--hairline-strong);border-radius:99px}

/* COLUMN */
.column{flex:0 0 270px;min-width:270px;display:flex;flex-direction:column;gap:10px}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px 2px}
.col-label{display:flex;align-items:center;gap:7px;
  font-family:'Inter',sans-serif;font-size:12px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;color:var(--ink-subtle)}
.col-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.col-count{min-width:20px;height:20px;border-radius:99px;padding:0 6px;
  background:var(--surface-2);border:1px solid var(--hairline);
  font-size:11px;font-weight:600;color:var(--ink-subtle);display:grid;place-items:center}

/* CARDS LIST */
.cards{display:flex;flex-direction:column;gap:9px;min-height:72px;padding:2px 0}

/* CARD */
.card{padding:12px 14px;border-radius:var(--r);background:var(--surface-1);
  border:1px solid var(--hairline);cursor:pointer;user-select:none;
  transition:transform .2s,border-color .2s,background .2s}
.card:hover{transform:translateY(-2px);border-color:var(--primary);background:var(--surface-2)}
.card-co{font-size:11px;font-weight:600;color:var(--primary);
  letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px}
.card-title{font-family:'Inter',sans-serif;font-size:14px;font-weight:600;
  line-height:1.35;margin-bottom:8px;color:var(--ink)}
.card-foot{display:flex;justify-content:space-between;align-items:center}
.card-date{font-size:11px;color:var(--ink-tertiary)}
.card-badges{display:flex;align-items:center;gap:7px}
.badge-kit{font-size:10px;padding:2px 7px;border-radius:99px;
  background:rgba(39,166,68,.1);border:1px solid rgba(39,166,68,.3);
  color:var(--semantic-success);font-weight:600}
.card-ext{font-size:13px;color:var(--ink-subtle);transition:color .2s}
.card-ext:hover{color:var(--primary)}
.card-ghost{opacity:.3;border-style:dashed}
.card-chosen{box-shadow:0 16px 48px rgba(0,0,0,.55)}
.card-dragging{transform:rotate(1.5deg)}

.col-empty{padding:20px;border-radius:var(--r);border:1px dashed var(--hairline);
  text-align:center;color:var(--ink-tertiary);font-size:12px;line-height:1.7}

/* OVERLAY + MODAL */
#overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
.modal{position:fixed;z-index:201;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow-y:auto}
.modal-lg{width:min(680px,calc(100vw - 32px))}
.mbox{background:var(--surface-1);border:1px solid var(--hairline-strong);border-radius:12px;
  box-shadow:0 32px 80px rgba(0,0,0,.65);overflow:hidden}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 24px 0}
.mhead h2{font-family:'Inter',sans-serif;font-size:18px;font-weight:700;color:var(--ink)}
.mclose{width:28px;height:28px;border-radius:6px;background:var(--surface-2);border:1px solid var(--hairline);
  color:var(--ink-subtle);font-size:13px;display:grid;place-items:center;
  cursor:pointer;flex-shrink:0;transition:all .2s}
.mclose:hover{background:var(--surface-3);color:var(--ink)}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding-top:4px}
.mhead-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* FORM */
form,.mbody{padding:16px 24px 20px;display:flex;flex-direction:column;gap:12px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:11px;font-weight:600;color:var(--ink-subtle);letter-spacing:.05em;text-transform:uppercase}
.fg .hint{font-weight:400;color:var(--ink-tertiary);text-transform:none;letter-spacing:0}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fhint{font-size:11px;color:var(--ink-tertiary)}
input,textarea,select{width:100%;padding:8px 12px;background:var(--surface-2);
  border:1px solid var(--hairline-strong);border-radius:var(--rs);font-size:13px;color:var(--ink);
  outline:none;transition:border-color .2s;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--primary)}
input::placeholder,textarea::placeholder{color:var(--ink-tertiary)}
select option{background:var(--surface-1);color:var(--ink)}
.irow{display:flex;gap:8px}.irow input{flex:1}

/* DETAIL */
.dmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:13px;color:var(--ink-subtle);margin-top:5px}
.msep{color:var(--ink-tertiary)}
.dco{font-weight:700;color:var(--primary)}
.dlink{color:var(--primary);font-size:13px;font-weight:500;transition:opacity .2s}
.dlink:hover{opacity:.7}
.dbody{padding:16px 24px 20px;display:flex;flex-direction:column;gap:14px}
.isel{padding:4px 8px;width:auto;font-size:12px;font-weight:600;border-radius:6px;cursor:pointer;background:var(--surface-2);border:1px solid var(--hairline);color:var(--ink)}

/* KIT */
.kit-divider{display:flex;align-items:center;gap:10px;
  font-size:11px;font-weight:600;color:var(--ink-subtle);letter-spacing:.05em;text-transform:uppercase}
.kit-divider::before,.kit-divider::after{content:'';flex:1;height:1px;background:var(--hairline)}
.kit-hint{font-size:12px;color:var(--ink-tertiary);text-align:center;margin-top:-4px}
.kit-loading{text-align:center;padding:28px;color:var(--ink-subtle);
  display:flex;flex-direction:column;align-items:center;gap:12px}
.kit-err{padding:12px;background:rgba(248,113,113,.07);
  border:1px solid rgba(248,113,113,.2);border-radius:var(--r);
  color:var(--semantic-error);display:flex;flex-direction:column;gap:8px}
.kit-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.kit-ready{font-size:12px;font-weight:700;color:var(--semantic-success);display:flex;align-items:center;gap:6px}
.kit-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.ktab{padding:8px 14px;border-radius:99px;background:var(--surface-2);border:1px solid var(--hairline);
  font-size:12px;font-weight:500;color:var(--ink-subtle);cursor:pointer;transition:all .2s}
.ktab:hover{border-color:var(--hairline-strong);color:var(--ink);background:var(--surface-3)}
.ktab.on{background:rgba(94,106,210,.15);border-color:var(--primary);color:var(--primary);font-weight:600}
.kit-text{padding:16px;border-radius:var(--rs);background:var(--surface-2);border:1px solid var(--hairline);
  font-size:13px;color:var(--ink);line-height:1.9;letter-spacing:0.2px;
  max-height:420px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;
  font-weight:400;text-align:left;margin:8px 0;
  font-family:'Inter',system-ui,sans-serif}
.kit-text-qa{padding:16px;border-radius:var(--rs);background:var(--surface-2);border:1px solid var(--hairline);
  max-height:420px;overflow-y:auto;margin:8px 0}
.qa-pair{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--hairline)}
.qa-pair:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.qa-question{font-weight:600;color:var(--primary);font-size:13px;margin-bottom:8px;line-height:1.6}
.qa-answer{color:var(--ink);font-size:13px;line-height:1.9;font-weight:400;margin-left:4px;padding-left:12px;border-left:2px solid var(--hairline-strong)}
.kit-copy-row{display:flex;justify-content:flex-end;margin-top:12px;gap:8px}

/* SPINNER */
.spin{width:34px;height:34px;border-radius:50%;
  border:3px solid var(--hairline-strong);border-top-color:var(--primary);
  animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:400;
  padding:10px 16px;border-radius:6px;background:var(--semantic-success);
  color:#fff;font-size:13px;font-weight:600;
  box-shadow:0 4px 20px rgba(39,166,68,.3);
  animation:tin .3s ease}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(6px)}}

/* WELCOME */
.welcome{position:fixed;bottom:24px;right:24px;z-index:50;
  padding:12px 16px;background:var(--surface-1);
  border:1px solid var(--primary);border-radius:8px;
  font-size:13px;line-height:1.5;
  box-shadow:0 8px 32px rgba(0,0,0,.5);max-width:260px;cursor:pointer}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--hairline-strong);border-radius:99px}

@media(max-width:600px){
  .nav{padding:0 14px}
  .board{padding:calc(var(--nav) + 14px) 12px 32px;gap:10px}
  .column{flex:0 0 240px;min-width:240px}
  .frow{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="grid-overlay"></div>

<!-- NAV -->
<nav class="nav">
  <div class="nav-brand">
    <div class="nav-logo">🎯</div>
    Job Tracker
  </div>
  <div class="nav-actions">
    <button class="btn btn-ghost btn-sm" id="btn-settings">⚙ Settings</button>
    <button class="btn btn-primary btn-sm" id="btn-add">+ Add Job</button>
  </div>
</nav>

<!-- BOARD -->
<main class="board">
  <div class="column" data-col="wishlist">
    <div class="col-head">
      <div class="col-label"><span class="col-dot" style="background:var(--c-wish)"></span>Wishlist</div>
      <span class="col-count">0</span>
    </div>
    <div class="cards" data-column="wishlist"></div>
  </div>
  <div class="column" data-col="applied">
    <div class="col-head">
      <div class="col-label"><span class="col-dot" style="background:var(--c-app)"></span>Applied</div>
      <span class="col-count">0</span>
    </div>
    <div class="cards" data-column="applied"></div>
  </div>
  <div class="column" data-col="interviewing">
    <div class="col-head">
      <div class="col-label"><span class="col-dot" style="background:var(--c-int)"></span>Interviewing</div>
      <span class="col-count">0</span>
    </div>
    <div class="cards" data-column="interviewing"></div>
  </div>
  <div class="column" data-col="offer">
    <div class="col-head">
      <div class="col-label"><span class="col-dot" style="background:var(--c-off)"></span>Offer</div>
      <span class="col-count">0</span>
    </div>
    <div class="cards" data-column="offer"></div>
  </div>
  <div class="column" data-col="rejected">
    <div class="col-head">
      <div class="col-label"><span class="col-dot" style="background:var(--c-rej)"></span>Rejected</div>
      <span class="col-count">0</span>
    </div>
    <div class="cards" data-column="rejected"></div>
  </div>
</main>

<!-- OVERLAY -->
<div id="overlay" hidden></div>

<!-- MODAL: Add Job -->
<div id="m-add" class="modal" hidden>
  <div class="mbox">
    <div class="mhead">
      <h2>Add New Job</h2>
      <button class="mclose" data-close>✕</button>
    </div>
    <form id="f-add">
      <div class="frow">
        <div class="fg"><label>Job Title *</label><input name="title" required placeholder="Senior .NET Engineer"></div>
        <div class="fg"><label>Company *</label><input name="company" required placeholder="Acme Corp"></div>
      </div>
      <div class="frow">
        <div class="fg"><label>Job URL</label><input name="url" type="url" placeholder="https://linkedin.com/jobs/..."></div>
        <div class="fg">
          <label>Column</label>
          <select name="column">
            <option value="wishlist">Wishlist</option>
            <option value="applied">Applied</option>
            <option value="interviewing">Interviewing</option>
            <option value="offer">Offer</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
      </div>
      <div class="fg">
        <label>Job Description <span class="hint">— paste from posting (AI uses this)</span></label>
        <textarea name="description" rows="5" placeholder="Paste the full job description here…"></textarea>
      </div>
      <div class="fg"><label>Notes</label><textarea name="notes" rows="2" placeholder="Salary, recruiter name, deadline…"></textarea></div>
      <div class="mfoot">
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Add Job</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL: Job Detail -->
<div id="m-detail" class="modal modal-lg" hidden>
  <div class="mbox">
    <div class="mhead">
      <div>
        <h2 id="d-title"></h2>
        <div class="dmeta">
          <span id="d-co" class="dco"></span>
          <span class="msep">•</span>
          <span id="d-date"></span>
          <span class="msep">•</span>
          <select id="d-col" class="isel">
            <option value="wishlist">Wishlist</option>
            <option value="applied">Applied</option>
            <option value="interviewing">Interviewing</option>
            <option value="offer">Offer</option>
            <option value="rejected">Rejected</option>
          </select>
          <span id="d-sep" class="msep">•</span>
          <a id="d-link" href="#" target="_blank" rel="noopener" class="dlink">↗ View Job</a>
        </div>
      </div>
      <div class="mhead-actions">
        <button class="btn btn-sm btn-danger" id="btn-del">Delete</button>
        <button class="mclose" data-close>✕</button>
      </div>
    </div>
    <div class="dbody">
      <div class="fg"><label>Notes</label>
        <textarea id="d-notes" rows="3" placeholder="Recruiter contact, deadline, salary range…"></textarea>
      </div>
      <div class="kit-divider"><span>✨ Generate Kit</span></div>
      <div id="kit"></div>
    </div>
  </div>
</div>

<!-- MODAL: Settings -->
<div id="m-settings" class="modal" hidden>
  <div class="mbox">
    <div class="mhead">
      <h2>Settings</h2>
      <button class="mclose" data-close>✕</button>
    </div>
    <form id="f-settings">
      <div class="fg">
        <label>API Key</label>
        <div class="irow">
          <input id="s-key" type="password" placeholder="euri_…" autocomplete="off">
          <button type="button" class="btn btn-sm btn-ghost" id="btn-eye">Show</button>
        </div>
        <p class="fhint">Saved in your browser only. Sent directly to Euron API — never stored elsewhere.</p>
      </div>
      <div class="fg">
        <label>Your Resume <span class="hint">— used for resume bullet rewriting</span></label>
        <textarea id="s-resume" rows="10" placeholder="Paste your full resume text here…"></textarea>
      </div>
      <div class="mfoot">
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Save Settings</button>
      </div>
    </form>
  </div>
</div>

<script>
'use strict';
const COLS=['wishlist','applied','interviewing','offer','rejected'];

// Storage
const DB={
  jobs:()=>JSON.parse(localStorage.getItem('jt2_jobs')||'[]'),
  save:(j)=>localStorage.setItem('jt2_jobs',JSON.stringify(j)),
  cfg:()=>JSON.parse(localStorage.getItem('jt2_cfg')||'{}'),
  saveCfg:(c)=>localStorage.setItem('jt2_cfg',JSON.stringify(c)),
};

let jobs=DB.jobs(), cfg=DB.cfg(), activeId=null, activeTab='coverLetter';

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt=d=>new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const $=id=>document.getElementById(id);

function toast(msg,color='var(--ok)'){
  const t=document.createElement('div');
  t.className='toast';t.style.background=color;t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2800);
}

// ── RENDER BOARD
function render(){
  COLS.forEach(col=>{
    const colJobs=jobs.filter(j=>j.column===col);
    const countEl=document.querySelector(`[data-col="${col}"] .col-count`);
    const cardsEl=document.querySelector(`[data-col="${col}"] .cards`);
    if(!cardsEl)return;
    if(countEl)countEl.textContent=colJobs.length;
    cardsEl.innerHTML=colJobs.length
      ?colJobs.map(cardHTML).join('')
      :'<div class="col-empty">Drag cards here<br>or click + Add Job</div>';
    cardsEl.querySelectorAll('.card').forEach(el=>
      el.addEventListener('click',()=>openDetail(el.dataset.id))
    );
  });
}

function cardHTML(j){
  return `<div class="card" data-id="${esc(j.id)}">
    <div class="card-co">${esc(j.company)}</div>
    <div class="card-title">${esc(j.title)}</div>
    <div class="card-foot">
      <span class="card-date">${fmt(j.dateAdded)}</span>
      <div class="card-badges">
        ${j.kit?'<span class="badge-kit">Kit ✓</span>':''}
        ${j.url?`<a class="card-ext" href="${esc(j.url)}" target="_blank" rel="noopener" title="View posting" onclick="event.stopPropagation()">↗</a>`:''}
      </div>
    </div>
  </div>`;
}

// ── DRAG & DROP
function initDrag(){
  document.querySelectorAll('.cards').forEach(el=>{
    Sortable.create(el,{
      group:'board',animation:180,
      ghostClass:'card-ghost',chosenClass:'card-chosen',dragClass:'card-dragging',
      onEnd(e){
        const id=e.item.dataset.id, nc=e.to.dataset.column;
        const j=jobs.find(x=>x.id===id);
        if(j&&j.column!==nc){j.column=nc;DB.save(jobs);render();}
      }
    });
  });
}

// ── MODAL SYSTEM
const overlay=$('overlay');
function show(id){
  document.querySelectorAll('.modal').forEach(m=>m.hidden=true);
  $(id).hidden=false;overlay.hidden=false;
  document.body.style.overflow='hidden';
}
function close(){
  document.querySelectorAll('.modal').forEach(m=>m.hidden=true);
  overlay.hidden=true;document.body.style.overflow='';activeId=null;
}
overlay.addEventListener('click',close);
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',close));

// ── ADD JOB
$('btn-add').addEventListener('click',()=>{
  $('f-add').reset();show('m-add');
  $('f-add').querySelector('input[name="title"]').focus();
});
$('f-add').addEventListener('submit',e=>{
  e.preventDefault();
  const fd=new FormData(e.target);
  const j={
    id:uid(),title:fd.get('title').trim(),company:fd.get('company').trim(),
    url:fd.get('url').trim(),description:fd.get('description').trim(),
    notes:fd.get('notes').trim(),column:fd.get('column')||'wishlist',
    dateAdded:new Date().toISOString(),kit:null,
  };
  jobs.unshift(j);DB.save(jobs);render();close();
  toast('Job added ✓');
});

// ── JOB DETAIL
function openDetail(id){
  const j=jobs.find(x=>x.id===id);if(!j)return;
  activeId=id;activeTab='coverLetter';
  $('d-title').textContent=j.title;
  $('d-co').textContent=j.company;
  $('d-date').textContent=fmt(j.dateAdded);
  $('d-col').value=j.column;
  $('d-notes').value=j.notes||'';
  const lk=$('d-link'),sp=$('d-sep');
  if(j.url){lk.href=j.url;lk.hidden=false;sp.hidden=false;}
  else{lk.hidden=true;sp.hidden=true;}
  renderKit(j);show('m-detail');
}

$('d-notes').addEventListener('input',e=>{
  const j=jobs.find(x=>x.id===activeId);
  if(j){j.notes=e.target.value;DB.save(jobs);}
});
$('d-col').addEventListener('change',e=>{
  const j=jobs.find(x=>x.id===activeId);
  if(j){j.column=e.target.value;DB.save(jobs);render();}
});
$('btn-del').addEventListener('click',()=>{
  if(!confirm('Delete this job? Cannot be undone.'))return;
  jobs=jobs.filter(x=>x.id!==activeId);
  DB.save(jobs);render();close();
});

// ── FORMAT Q&A PAIRS
function formatQA(text){
  if(!text)return'';
  const lines=text.split('\n').filter(l=>l.trim());
  let html='';let currentQ='';let currentA='';
  lines.forEach(line=>{
    const trimmed=line.trim();
    if(trimmed.match(/^Q\d+:/i)){
      if(currentQ&&currentA){html+=`<div class="qa-pair"><div class="qa-question">${esc(currentQ)}</div><div class="qa-answer">${esc(currentA)}</div></div>`;}
      currentQ=trimmed.replace(/^Q\d+:\s*/i,'');currentA='';
    }else if(trimmed.match(/^A:|^→/i)){
      currentA=trimmed.replace(/^(?:A:|→)\s*/i,'');
    }else if(currentQ&&!currentA&&trimmed){
      currentA=trimmed;
    }else if(currentQ&&currentA&&trimmed){
      currentA+=` ${trimmed}`;
    }
  });
  if(currentQ&&currentA){html+=`<div class="qa-pair"><div class="qa-question">${esc(currentQ)}</div><div class="qa-answer">${esc(currentA)}</div></div>`;}
  return html||'<p style="color:var(--ink-tertiary)">No Q&A content yet</p>';
}

// ── GENERATE KIT
function renderKit(j){
  const sec=$('kit');if(!sec)return;
  if(!j.kit){
    sec.innerHTML=`
      <button class="btn btn-gen" id="btn-gen">
        <span style="font-size:18px">✨</span> Generate Kit
      </button>
      <p class="kit-hint">Creates cover letter · resume bullets · interview questions · company brief</p>`;
    $('btn-gen').addEventListener('click',generateKit);
    return;
  }
  const TABS=[
    {id:'coverLetter',label:'Cover Letter'},
    {id:'resumeBullets',label:'Resume Bullets'},
    {id:'interviewQuestions',label:'Interview Qs'},
    {id:'companyBrief',label:'Company Brief'},
  ];
  const qaContent=activeTab==='interviewQuestions'?formatQA(j.kit[activeTab]||''):esc(j.kit[activeTab]||'').replace(/\n/g,'<br>');
  const contentClass=activeTab==='interviewQuestions'?'kit-text-qa':'kit-text';
  sec.innerHTML=`
    <div class="kit-head">
      <span class="kit-ready">✓ Kit Ready</span>
      <button class="btn btn-sm btn-ghost" id="btn-regen">Regenerate</button>
    </div>
    <div class="kit-tabs">
      ${TABS.map(t=>`<button class="ktab${t.id===activeTab?' on':''}" data-tab="${t.id}">${t.label}</button>`).join('')}
    </div>
    <div class="${contentClass}">${qaContent}</div>
    <div class="kit-copy-row"><button class="btn btn-sm btn-ghost" id="btn-copy">Copy</button></div>`;

  sec.querySelectorAll('.ktab').forEach(b=>b.addEventListener('click',()=>{
    activeTab=b.dataset.tab;
    renderKit(jobs.find(x=>x.id===activeId));
  }));
  $('btn-regen').addEventListener('click',()=>{
    const j=jobs.find(x=>x.id===activeId);
    if(j){j.kit=null;DB.save(jobs);renderKit(j);}
  });
  $('btn-copy').addEventListener('click',function(){
    const j=jobs.find(x=>x.id===activeId);
    if(j?.kit?.[activeTab]){
      navigator.clipboard.writeText(j.kit[activeTab]).then(()=>{
        this.textContent='Copied!';
        setTimeout(()=>{this.textContent='Copy';},2000);
      });
    }
  });
}

async function generateKit(){
  const j=jobs.find(x=>x.id===activeId);if(!j)return;
  if(!cfg.apiKey){
    toast('Add your API key in ⚙ Settings first','#f59e0b');
    close();setTimeout(openSettings,120);return;
  }
  $('kit').innerHTML=`
    <div class="kit-loading">
      <div class="spin"></div>
      <p>Generating your kit — takes 20–40 seconds…</p>
    </div>`;
  const resume=cfg.resume||'(No resume provided — add it in Settings for better results)';
  const ctx=`Job Title: ${j.title}\nCompany: ${j.company}\nJob Description:\n${j.description||'(not provided)'}`;
  try{
    const [cl,rb,iq,cb]=await Promise.all([
      ai(`Write a concise, professional cover letter (2 short paragraphs max).\n\n${ctx}\n\nApplicant Resume:\n${resume}\n\nRequirements:\n- Paragraph 1: Strong hook showing enthusiasm and 1-2 relevant achievements\n- Paragraph 2: Why you're perfect for this role + key skills match\n- Sign off: Saurabh Kumar\n- Keep it under 200 words, ready to copy-paste and send\n- No flowery language, direct and impactful`),
      ai(`You are a professional resume writer. Rewrite 5–6 of the applicant's most relevant bullet points for this specific role. Focus on achievements with metrics.\n\n${ctx}\n\nApplicant Resume:\n${resume}\n\nReturn ONLY the bullets, one per line, each starting with •. No intro text.`),
      ai(`You are a senior interview coach preparing interview Q&A. Generate 4-5 most likely interview questions with FULL, conversational answers (as the applicant would naturally speak).\n\n${ctx}\n\nApplicant Resume:\n${resume}\n\nRequirements for EACH answer:\n- Sound conversational and human (not robotic)\n- Show genuine understanding of the skill/topic\n- Include a brief relevant example or achievement from resume\n- Demonstrate problem-solving approach or learning mindset\n- Keep to 3-4 sentences (natural speaking length)\n- Use "I" language, speak authentically\n\nFormat exactly:\nQ1: [Question]\nA: [Full conversational answer]\n\nQ2: [Question]\nA: [Full conversational answer]\n\n(and so on - 4-5 total)`),
      ai(`Write a concise company brief (under 400 words) for a job applicant preparing to interview.\n\nCompany: ${j.company}\n${j.url?'Job URL: '+j.url:''}\n${j.description?'Job context:\n'+j.description.slice(0,800):''}\n\nCover: what they do, key products, culture/values, size/stage, and 2–3 things to mention in the interview. Use short paragraphs.`),
    ]);
    j.kit={coverLetter:cl,resumeBullets:rb,interviewQuestions:iq,companyBrief:cb};
    DB.save(jobs);render();activeTab='coverLetter';renderKit(j);
    toast('Kit ready ✓');
  }catch(err){
    $('kit').innerHTML=`
      <div class="kit-err">
        <strong>⚠ Error</strong>
        <p>${esc(err.message)}</p>
        <button class="btn btn-sm btn-ghost" id="btn-retry">Try Again</button>
      </div>`;
    $('btn-retry').addEventListener('click',generateKit);
  }
}

async function ai(prompt){
  const r=await fetch('https://api.euron.one/api/v1/euri/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':`Bearer ${cfg.apiKey}`},
    body:JSON.stringify({model:'gpt-5.3-instant',messages:[{role:'user',content:prompt}],max_tokens:1400,temperature:0.72}),
  });
  if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d?.error?.message||`API error ${r.status}`);}
  const d=await r.json();
  return d.choices[0].message.content.trim();
}
