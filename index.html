<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Automation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #010102;
      color: #e2e4e9;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .tools {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      max-width: 320px;
    }
    a {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.875rem 1.25rem;
      background: #0f0f11;
      border: 1px solid #1e1e24;
      border-radius: 8px;
      color: #e2e4e9;
      text-decoration: none;
      font-size: 0.9rem;
      transition: border-color 0.15s, background 0.15s;
    }
    a:hover {
      background: #16161c;
      border-color: #5e6ad2;
      color: #fff;
    }
    .badge {
      margin-left: auto;
      font-size: 0.7rem;
      color: #5e6ad2;
      background: rgba(94, 106, 210, 0.1);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Automation</h1>
  <nav class="tools">
    <a href="/jobs">
      Job Finder
      <span class="badge">kanban</span>
    </a>
  </nav>
</body>
</html>
